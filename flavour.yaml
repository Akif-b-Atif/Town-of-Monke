  - "{player} was found in pieces. A Serial Killer walks among you."
  - "A Serial Killer claimed {player} in the night."
  - "{player} met a blade in the dark. A Serial Killer was here."

death.cause.veteran:
  - "{player} was shot by a Veteran on alert."
  - "{player} knocked on the wrong door and met a Veteran's rifle."
  - "{player} visited a Veteran and did not leave."

death.cause.jailor:
