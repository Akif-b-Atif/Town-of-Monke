# =============================================================================

# ----- Nobody died during the night. Vars: none. (4 variants)
dawn.no_deaths:
  - "Nobody died last night."
  - "The town wakes up to find, somehow, that everyone is still alive."
  - "A quiet night. No bodies were found this morning."
  - "The sun rises on a town with no new graves."

# ----- Line before the list of deaths. Vars: none. (2 variants)
dawn.deaths_intro:
  - "Bad news greets the town this morning."
  - "The townsfolk gather around a grim discovery."

# ----- Survivors line. Vars: {alive}. (2 variants)
