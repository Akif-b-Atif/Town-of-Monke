  - "Only {alive} are left standing."

# ----- CAUSE OF DEATH. One line per death. Vars: {player}. (3-4 variants each)
death.cause.mafia:
  - "{player} was gunned down in the night by the Mafia."
  - "The Mafia came for {player} in the dark."
  - "{player} was found dead, a calling card of the Mafia beside them."
