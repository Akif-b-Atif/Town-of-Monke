# =============================================================================
# TOWN OF MONKE - FLAVOUR TEXT (v1.1 default file)
# =============================================================================
# HOW TO EDIT
#   * Every top-level key is one scenario. The banner comment above it says
#     exactly when it is used and which {placeholders} it may contain.
#   * A key holds either ONE string, or a LIST of variants (lines starting
#     with "- "). With several variants the bot rotates through them without
#     repeating until all have been used.
#   * Add a variant: add a new "- " line. Remove one: delete the line, but
#     keep at least the minimum noted in the banner.
#   * Markdown works (**bold**, *italic*). "\n" makes a new line.
#   * Only use the placeholders listed for that key. After editing, run
#     /reloadtext. If something is wrong the bot tells you and keeps the
#     old text.
#   * Strings are in double quotes. If you need a double quote inside a
#     string, write \" instead.
# PLACEHOLDERS (availability depends on the key)
#   {player} {target} {role} {alignment} {killer_role} {causes} {will} {note}
#   {day} {night} {alive} {count} {needed} {time} {wiki}
# =============================================================================


# =============================================================================
# SECTION 1: ROLE CARDS (sent by DM at game start and on /role)
# Per role: intro (flavour + ability explanation + wiki link), goal, tips,
# reveal (third person, used in death announcements), wiki (URL only).
# Vars: intro/goal/tips use {wiki} only. reveal uses {player}.
# =============================================================================

# ----- JAILOR -----
role.jailor.intro: "You are the **Jailor**, keeper of the dungeon beneath Monke Town. Each day you may choose one player to haul off to jail that night. Once they are locked up you can question them anonymously and, if you must, execute them. Execute a fellow Town member and you lose your executions for good.\nWiki: {wiki}"
role.jailor.goal: "Lynch every criminal and evildoer."
role.jailor.tips: "Your prisoner cannot use their ability, and nobody can hurt them tonight. Interrogate before you execute, and be very sure."
role.jailor.reveal: "{player} was the **Jailor**, a merciless keeper of the town dungeon."
role.jailor.wiki: "https://town-of-salem.fandom.com/wiki/Jailor"

# ----- VETERAN -----
role.veteran.intro: "You are the **Veteran**, a battle-scarred soldier who sleeps with one eye open. On any night you choose you may go on alert (you have a limited number of alerts). Anyone who visits you that night is shot, friend or foe.\nWiki: {wiki}"
role.veteran.goal: "Lynch every criminal and evildoer."
role.veteran.tips: "Alerts are limited, so save them for nights you expect visitors. Your own shots hit Town too."
role.veteran.reveal: "{player} was the **Veteran**, a paranoid soldier who trusted nobody."
role.veteran.wiki: "https://town-of-salem.fandom.com/wiki/Veteran"

# ----- SHERIFF -----
role.sheriff.intro: "You are the **Sheriff**, the law of Monke Town. Each night you may investigate one player and learn whether they seem innocent or suspicious. Beware: not every guilty soul looks guilty.\nWiki: {wiki}"
role.sheriff.goal: "Lynch every criminal and evildoer."
role.sheriff.tips: "The Godfather appears innocent to you. Use your results to guide the town without revealing yourself too early."
role.sheriff.reveal: "{player} was the **Sheriff**, a lawman with a tarnished badge and a sharp eye."
role.sheriff.wiki: "https://town-of-salem.fandom.com/wiki/Sheriff"

# ----- DOCTOR -----
role.doctor.intro: "You are the **Doctor**, a healer who never sleeps. Each night you may protect one player from death. You may heal yourself once. You will learn if your patient was attacked.\nWiki: {wiki}"
role.doctor.goal: "Lynch every criminal and evildoer."
role.doctor.tips: "Healing cannot stop an execution or a haunting. Guess who the killers want, and be there first."
role.doctor.reveal: "{player} was the **Doctor**, a healer who never turned a patient away."
role.doctor.wiki: "https://town-of-salem.fandom.com/wiki/Doctor"

# ----- ESCORT -----
role.escort.intro: "You are the **Escort**, the most charming person in town. Each night you may distract one player so they cannot use their ability. Jailors, Veterans and other Escorts are immune to your charms.\nWiki: {wiki}"
role.escort.goal: "Lynch every criminal and evildoer."
role.escort.tips: "Distracting a killer is as good as saving someone. Distracting a Veteran gets you shot."
role.escort.reveal: "{player} was the **Escort**, a charmer who kept many an evildoer busy."
role.escort.wiki: "https://town-of-salem.fandom.com/wiki/Escort"

# ----- GODFATHER -----
role.godfather.intro: "You are the **Godfather**, head of the Mafia. Each night you may order the Mafioso to kill a target of your choosing. If there is no Mafioso, you do the deed yourself. You have basic defense and appear innocent to the Sheriff.\nWiki: {wiki}"
role.godfather.goal: "Kill everyone who would oppose the Mafia."
role.godfather.tips: "Let the Mafioso take the risk. Talk to your family in the Mafia Lair at night."
role.godfather.reveal: "{player} was the **Godfather**, a polite man who made offers nobody could refuse."
role.godfather.wiki: "https://town-of-salem.fandom.com/wiki/Godfather"

# ----- MAFIOSO -----
role.mafioso.intro: "You are the **Mafioso**, the Godfather's trusted gun. You carry out the Godfather's orders. If he gives none, you may choose a victim yourself.\nWiki: {wiki}"
role.mafioso.goal: "Kill everyone who would oppose the Mafia."
role.mafioso.tips: "If the Godfather's order and your own plan differ, his word wins. Stay hidden by day."
role.mafioso.reveal: "{player} was the **Mafioso**, a hired gun with a loyal heart."
role.mafioso.wiki: "https://town-of-salem.fandom.com/wiki/Mafioso"

# ----- CONSIGLIERE -----
role.consigliere.intro: "You are the **Consigliere**, the Mafia's eyes and ears. Each night you may investigate one player and learn their exact role.\nWiki: {wiki}"
role.consigliere.goal: "Kill everyone who would oppose the Mafia."
role.consigliere.tips: "Tell your family who the dangerous townies are before the Sheriff finds you."
role.consigliere.reveal: "{player} was the **Consigliere**, an advisor who knew everyone's secrets."
role.consigliere.wiki: "https://town-of-salem.fandom.com/wiki/Consigliere"

# ----- SERIAL KILLER -----
role.serial_killer.intro: "You are the **Serial Killer**, a merciless killer who answers to no one. Each night you may kill a player. If you are jailed or roleblocked, you lash out at whoever caught you. You have basic defense.\nWiki: {wiki}"
role.serial_killer.goal: "Be the last one standing, with nobody left who could stop you."
role.serial_killer.tips: "Town and Mafia both want you dead. Do not draw attention, and beware the Jailor."
role.serial_killer.reveal: "{player} was the **Serial Killer**, a merciless killer who fell at last."
role.serial_killer.wiki: "https://town-of-salem.fandom.com/wiki/Serial_Killer"

# ----- JESTER -----
role.jester.intro: "You are the **Jester**, a trickster with a death wish. You have no night ability. Your only goal is to trick the town into lynching you. If they do, your ghost haunts one living player who voted guilty, killing them.\nWiki: {wiki}"
role.jester.goal: "Get yourself lynched."
role.jester.tips: "Be suspicious, but not too suspicious. Do not make it obvious."
role.jester.reveal: "{player} was the **Jester**, a fool who wanted the noose."
role.jester.wiki: "https://town-of-salem.fandom.com/wiki/Jester"


# =============================================================================
# SECTION 2: GAME START AND PHASE BANNERS
# =============================================================================

# ----- Posted in Town Centre when the game begins. Vars: none. (2 variants)
game.start.public:
  - "The role list is posted below. Monke Town awakens, and not everyone here is who they say they are."
  - "A hush falls over Monke Town. Somewhere among you, evil is already planning its first move. The role list is posted below."

# ----- Header above the public role list. Vars: {count}
game.rolelist.header: "**Role list ({count} players)**"

# ----- Day 1 banner. Vars: {day}. (2 variants)
phase.day1:
  - "**Day 1.** A new game begins. Use this time to plan before night falls."
  - "**Day 1.** Monke Town is quiet and nervous. Say hello, and say little."

# ----- Dawn banner, every later day. Vars: {day}. (4 variants, rotated)
phase.dawn:
  - "**Day {day}.** It is a beautiful morning in the town of Monke."
  - "**Day {day}.** The rooster crows over Monke Town as the sun climbs."
  - "**Day {day}.** Mist hangs over the rooftops of Monke Town as the townsfolk stir."
  - "**Day {day}.** The market stalls open, but every eye darts nervously."

# ----- Noon banner, voting opens. Vars: {day}, {time}. (3 variants)
phase.noon:
  - "**Noon, Day {day}.** The town gathers in the square. Voting is open until {time}."
  - "**Noon, Day {day}.** The bell tolls. Cast your votes before {time}."
  - "**Noon, Day {day}.** The town square fills with whispers. Who will you accuse? You have until {time}."

# ----- Afternoon banner. Vars: {day}, {time}. (3 variants)
phase.afternoon:
  - "**Afternoon, Day {day}.** The shadows lengthen. Talk while you still can; night falls {time}."
  - "**Afternoon, Day {day}.** The sun begins to sink. Last chance to talk things through, until {time}."
  - "**Afternoon, Day {day}.** The day wanes. Say what must be said before {time}."

# ----- Night banner. Vars: {night}, {time}. (4 variants)
phase.night:
  - "**Night {night}.** Darkness settles over Monke Town. Make your choices before {time}."
  - "**Night {night}.** The lanterns go out one by one. You have until {time} to act."
  - "**Night {night}.** Doors are bolted, but bolts have never stopped the wicked. Choose before {time}."
  - "**Night {night}.** The town sleeps with one eye open. Decide before {time}."

# ----- Time-running-out warning. Vars: {time}. (3 variants)
phase.warning:
  - "Only {time} remain."
  - "The clock is ticking. {time} left."
  - "Hurry along, {time} remain."

# ----- Game paused / resumed. Vars: none. (2 variants each)
phase.paused:
  - "**The game is paused.** Monke Town holds its breath."
  - "**The game is paused** by the admin. Stay where you are."
phase.resumed:
  - "**The game resumes.** Monke Town stirs again."
  - "**The game resumes.** Time flows once more."

# ----- DM nudge when you have not chosen yet. Vars: {time}. (2 variants)
night.nudge:
  - "You have not chosen a target yet. {time} remain."
  - "Time is almost up and you have not acted. {time} left."

# ----- Feedback when a player presses Skip ahead. Vars: {count}, {needed}
