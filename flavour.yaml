  - "**A will was found on {player}:**\n{will}"
death.no_will:
  - "{player} left no will."
  - "No will could be found."

# ----- Death note left by the killer. Vars: {note}. (2 variants)
death.note:
  - "**A note was left on the body:**\n{note}"
  - "**The killer left a message:**\n{note}"


# =============================================================================
# SECTION 4: VOTING AND TRIALS
# =============================================================================

# ----- A vote is cast. Vars: {player}, {target}, {count}, {needed}. (3 variants)
vote.cast:
  - "**{player}** voted for **{target}**. ({count}/{needed})"
  - "**{player}** points a finger at **{target}**. ({count}/{needed})"
  - "**{player}** has chosen **{target}**. ({count}/{needed})"

# ----- A vote is changed. Vars: {player}, {target} (new choice), {previous} (old choice), {count}, {needed}. (3 variants)
# (v1.1: {previous} was added so the line can say who the vote moved away from. Keep it in every variant.)
vote.change:
  - "**{player}** changed their vote from **{previous}** to **{target}**. ({count}/{needed})"
  - "**{player}** has second thoughts: out with **{previous}**, in with **{target}**. ({count}/{needed})"
  - "**{player}** switches sides, from **{previous}** to **{target}**. ({count}/{needed})"

# ----- A vote is withdrawn. Vars: {player}, {target} (whom the vote was against). (3 variants)
# (v1.1: {target} was added so the line can say which vote was withdrawn.)
vote.remove:
  - "**{player}** withdrew their vote from **{target}**."
  - "**{player}** takes back their vote against **{target}**."
  - "**{player}** has decided against it and cancels their vote for **{target}**."

# ----- Noon ended without a trial. Vars: none. (3 variants)
noon.no_trial:
  - "The town could not agree on anyone. There will be no trial today."
  - "Nobody gathered enough votes. The day drifts on."
  - "No accusation stuck. The sun begins to set."

# ----- A trial begins. Vars: {target}. (3 variants)
trial.start:
  - "**{target} is on trial!** The town demands answers."
  - "**{target}** is dragged before the town to answer for their crimes."
  - "**{target}** has been put on trial. The town waits to hear their side."

# ----- Defense phase. Vars: {target}, {time}. (3 variants)
trial.defense:
  - "{target}, you have {time} to defend yourself. Only you may speak."
  - "The floor is yours, {target}. You have {time}. Choose your words carefully."
  - "{target}, speak now. {time} remain, and nobody may interrupt."

# ----- Verdict phase. Vars: {target}, {time}. (3 variants)
trial.verdict:
  - "Time to decide: is **{target}** guilty or innocent? You have {time}."
  - "The town must judge **{target}**. You have {time} to choose."
  - "Guilty or innocent? Decide the fate of **{target}** within {time}."

# ----- Verdict: guilty. Vars: {target}, {count}, {needed}. (3 variants)
trial.guilty:
  - "The town has spoken: **{target}** is guilty and will be hanged."
  - "**{target}** has been found guilty. The gallows await."
  - "Guilty! The town sends **{target}** to the noose."

# ----- Verdict: pardoned. Vars: {target}. (3 variants)
trial.pardon:
  - "The town has spoken: **{target}** is pardoned."
  - "**{target}** walks free, for now."
  - "Not guilty. **{target}** is released and the mob disperses."

# ----- Vote reveal after a verdict. Vars: {count} (guilty), {needed} (innocent). 1 variant
trial.reveal: "**Verdict:** {count} guilty, {needed} innocent."

# ----- Three pardons, no more trials today. Vars: none. (2 variants)
trial.three_innocent:
  - "Three trials have failed. The town is tired and dusk approaches."
  - "The town has pardoned three accused. No more trials today."

# ----- Jester has been lynched. Vars: {player}. (2 variants)
jester.win_public:
  - "{player} was the Jester, and the town fell for the trick. Their ghost will haunt Monke Town."
  - "The Jester has won. {player}'s spirit lingers, and it is angry."


